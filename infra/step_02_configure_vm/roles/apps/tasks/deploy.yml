---
# TODO: migrator and seeder

- name: Deploy single target service (fast path)
  community.docker.docker_compose_v2:
    project_src: /opt/apps
    state: present
    pull: always
    services:
      - "{{ target_app }}"
  when: target_app is defined
  tags: [apps, deploy]

- name: Deploy full apps stack (full provision, no target_app)
  community.docker.docker_compose_v2:
    project_src: /opt/apps
    state: present
    pull: always
  when: target_app is not defined
  tags: [apps]

- name: Wait for Keycloak to be ready
  uri:
    url: "https://{{ idp_hostname }}/realms/master/.well-known/openid-configuration"
    status_code: 200
  register: kc_health
  retries: 30
  delay: 5
  until: kc_health.status == 200
  tags: [apps, deploy]

- name: Apply Keycloak realm configuration
  import_tasks: keycloak_realm.yml
  tags: [apps, deploy]
