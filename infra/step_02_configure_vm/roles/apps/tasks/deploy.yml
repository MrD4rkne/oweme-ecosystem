---
# A runner killed mid-migration skips the rescue below and leaves the named container behind,
# possibly still holding locks; remove it before the backup and the migration.
- name: Remove leftover api-migrator container
  ansible.builtin.command: docker rm -f api-migrator
  changed_when: false
  failed_when: false # absent container is the normal case; a real Docker problem fails the next task
  when: target_app is not defined or target_app == 'api'
  tags: [apps, deploy]

# Same gate as the migration. Same disk as the database, so refuse to dump when free space is short;
# dumps hold user data, so root-only. On a fresh VM this starts api-db and dumps an empty database.
- name: Back up API database before migration
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    install -d -m 700 /opt/backups
    cd /opt/apps
    docker compose up -d --wait api-db
    db_bytes=$(docker compose exec -T api-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_database_size(current_database())"')
    free_bytes=$(df --output=avail -B1 /opt/backups | tail -n1)
    if (( free_bytes < 2 * db_bytes )); then
      echo "Not enough disk for a backup: free=${free_bytes} db=${db_bytes}" >&2
      exit 1
    fi
    f="/opt/backups/api-${IMAGE_TAG}-$(date -u +%Y%m%dT%H%M%SZ).dump"
    trap 'rm -f "$f.tmp"' EXIT
    docker compose exec -T api-db sh -c 'pg_dump -U "$POSTGRES_USER" --lock-wait-timeout=60s -Fc "$POSTGRES_DB"' > "$f.tmp"
    mv "$f.tmp" "$f"
    ls -1t /opt/backups/api-*.dump | tail -n +11 | xargs -r rm --
  args:
    executable: /bin/bash
  environment:
    # Label with the deployed (pre-migration) version, so a restore starts the matching api.
    IMAGE_TAG: "{{ deployed_api_tag if deployed_api_tag is match('^[0-9A-Za-z][0-9A-Za-z._-]*$') else 'none' }}"
  changed_when: true
  when: target_app is not defined or target_app == 'api'
  tags: [apps, deploy]

# Runs before api is recreated, so a failed migration stops the deploy while the old api keeps serving.
- name: Migrate API database
  when: target_app is not defined or target_app == 'api'
  tags: [apps, deploy]
  block:
    - name: Run api-migrator
      community.docker.docker_compose_v2_run:
        project_src: /opt/apps
        service: api-migrator
        name: api-migrator
        cleanup: true
        tty: false
        quiet_pull: true
      register: api_migration
      # The module only returns rc in synchronous mode; it never fails on its own.
      failed_when: api_migration.rc != 0
      # Bounds a migration stuck on a lock so it cannot hold the deploy queue.
      timeout: 900

    - name: Record migrated API tag
      ansible.builtin.copy:
        content: "{{ image_tag }}\n"
        dest: /opt/apps/.migrated_api_tag
        mode: '0644'
      when: target_app is defined
  rescue:
    # The timeout only stops Ansible; without this the container keeps migrating on the VM.
    - name: Stop a still-running api-migrator
      ansible.builtin.command: docker rm -f api-migrator
      changed_when: true
      failed_when: false

    - name: Fail the deploy
      ansible.builtin.fail:
        msg: "API migration failed or timed out; the old api keeps serving."

- name: Deploy single target service (fast path)
  community.docker.docker_compose_v2:
    project_src: /opt/apps
    state: present
    pull: always
    wait: true
    wait_timeout: 300
    services:
      - "{{ target_app }}"
  when: target_app is defined
  tags: [apps, deploy]

- name: Deploy full apps stack (full provision, no target_app)
  community.docker.docker_compose_v2:
    project_src: /opt/apps
    state: present
    pull: always
    wait: true
    wait_timeout: 300
  when: target_app is not defined
  tags: [apps]
