---
# GHCR auth, compose file, and secret (.env) rendering.

# Version guard first, before anything (compose file included) is touched: CI builds can finish out of order,
# and an older run must not roll the host back. Migrations only go forward; downgrade only by hand with -e allow_downgrade=true.
- name: Validate image tag
  ansible.builtin.assert:
    that: image_tag is match('^[0-9A-Za-z][0-9A-Za-z._-]*$')
    fail_msg: "Invalid image_tag '{{ image_tag }}'"
  when: target_app is defined and target_app == 'api'
  tags: [apps, deploy]

# Deployed version = the higher of the api container's tag (running or stopped) and the last migrated tag.
# Not .env: it already names the new tag when a backup/migration/up fails.
- name: Read API container image
  ansible.builtin.command: >-
    docker ps -a --format json
    --filter label=com.docker.compose.project=apps
    --filter label=com.docker.compose.service=api
  register: running_api
  changed_when: false
  tags: [apps, deploy]

# Written after each successful migration: catches a run cancelled between migration and api start.
- name: Read last migrated API tag
  ansible.builtin.command: cat /opt/apps/.migrated_api_tag
  register: migrated_api
  changed_when: false
  failed_when: migrated_api.rc != 0 and 'No such file' not in migrated_api.stderr
  tags: [apps, deploy]

- name: Resolve deployed API tag
  ansible.builtin.set_fact:
    deployed_api_tag: >-
      {{ [((running_api.stdout_lines | first | from_json).Image.split(':') | last) if running_api.stdout_lines else '',
          migrated_api.stdout | trim]
         | select('match', '^\d+\.\d+\.\d+$') | community.general.version_sort | last | default('') }}
  tags: [apps, deploy]

- name: Skip API deploy older than the running image
  when:
    - target_app is defined and target_app == 'api'
    - deployed_api_tag is match('^\d+\.\d+\.\d+$')
    - image_tag is version(deployed_api_tag, '<')
    - not (allow_downgrade | default(false) | bool)
  tags: [apps, deploy]
  block:
    - name: Warn about skipped deploy
      ansible.builtin.debug:
        msg: "Skipping {{ image_tag }}: {{ deployed_api_tag }} is already deployed (set allow_downgrade=true to force)"

    - name: End play for this host
      ansible.builtin.meta: end_host

- name: Log in to GHCR on the VM (for pulling private images)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_username }}"
    password: "{{ vault_ghcr_token }}"
  tags: [apps, deploy]

- name: Create apps directory
  file:
    path: /opt/apps
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'
  tags: [apps]

- name: Copy Apps docker-compose template to server
  template:
    src: apps-docker-compose.yml.j2
    dest: /opt/apps/docker-compose.yml
    owner: deploy
    group: deploy
    mode: '0644'
  register: apps_compose
  tags: [apps, deploy]

- name: Render api.env (base — full provision only)
  template:
    src: api.env.j2
    dest: /opt/apps/api.env
    owner: deploy
    group: deploy
    mode: '0600'
    force: "{{ force_env_render | default(false) }}"
  tags: [apps, secrets]

- name: Render keycloak.env (base — full provision only)
  template:
    src: keycloak.env.j2
    dest: /opt/apps/keycloak.env
    owner: deploy
    group: deploy
    mode: '0600'
    force: "{{ force_env_render | default(false) }}"
  tags: [apps, secrets]

- name: Patch API image tag only
  lineinfile:
    path: /opt/apps/.env
    regexp: '^API_IMAGE_TAG='
    line: "API_IMAGE_TAG={{ image_tag }}"
    create: yes
  when: target_app is defined and target_app == 'api'
  tags: [apps, deploy]
