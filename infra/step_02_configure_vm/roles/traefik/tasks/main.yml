---
# Reverse proxy + automatic HTTPS. Depends on the `web` network from the
# docker role — make sure that role runs first (see site.yml).

- name: Ensure log directory exists for Traefik
  file:
    path: /var/log/traefik
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'
  tags: [traefik, base]

- name: Create Traefik directory structure
  file:
    path: /opt/traefik/letsencrypt
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'
    recurse: yes
  tags: [traefik]

- name: Ensure acme.json exists with correct permissions
  file:
    path: /opt/traefik/letsencrypt/acme.json
    state: touch
    owner: deploy
    group: deploy
    mode: '0600'
  tags: [traefik]

- name: Copy Traefik docker-compose template to server
  template:
    src: traefik-docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    owner: deploy
    group: deploy
    mode: '0644'
  register: traefik_compose
  tags: [traefik]

- name: Copy Traefik .env
  template:
    src: traefik.env.j2
    dest: /opt/traefik/.env
    owner: deploy
    group: deploy
    mode: '0600'
  register: traefik_env
  tags: [traefik]

- name: Start Traefik stack
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    state: present
    pull: "{{ 'always' if (traefik_compose.changed or traefik_env.changed) else 'missing' }}"
  tags: [traefik]

- import_tasks: crowdsec.yml
  tags: [traefik]
