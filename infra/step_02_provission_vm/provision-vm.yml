---
# site.yml
#
# Provisions an Ubuntu ARM64 VM (Oracle Cloud Ampere A1) to run:
#   - Traefik (reverse proxy + automatic HTTPS)
#   - Prometheus + Grafana (monitoring)
#   - N dotnet apps, each with its own DB, defined in vars.yml
#
# USAGE:
#   Full provision (first run, or after changing base packages/firewall):
#     ansible-playbook site.yml -i inventory/hosts.ini --vault-password-file .vault_pass
#
#   Fast path — redeploy app(s) only, e.g. after a GHCR push (used by CI):
#     ansible-playbook site.yml -i inventory/hosts.ini --tags deploy \
#       --vault-password-file .vault_pass \
#       -e "image_tag=1.2.3" -e "target_app=api"
#
#   Config/secret change only, no image pull:
#     ansible-playbook site.yml --tags secrets ...

- hosts: all
  become: yes
  vars_files:
    - vars.yml
    - vars/vault.yml

  tasks:
    # ============================================================
    # BASE SYSTEM
    # ============================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [base]

    - name: Upgrade all packages
      apt:
        upgrade: dist
      tags: [base]

    - name: Install essential packages
      apt:
        name:
          - curl
          - git
          - ufw
          - fail2ban
          - unattended-upgrades
          - jq
        state: present
      tags: [base]

    - name: Enable unattended security upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
      tags: [base]

    # ============================================================
    # FIREWALL
    # ============================================================
    - name: Set up UFW firewall rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
      tags: [base, firewall]

    - name: Set UFW default policies
      ufw:
        policy: deny
        direction: incoming
      tags: [base, firewall]

    - name: Enable UFW
      ufw:
        state: enabled
      tags: [base, firewall]

    - name: Configure fail2ban for sshd
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          maxretry = 5
          bantime = 1h
          findtime = 10m
      notify: restart fail2ban
      tags: [base, firewall]

    # ============================================================
    # DOCKER
    # ============================================================
    - name: Ensure python3-debian is installed (required by deb822_repository)
      apt:
        name: python3-debian
        state: present
      tags: [base, docker]

    - name: Add Docker repository (deb822 format)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/ubuntu"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: [stable]
        architectures: [arm64]
        signed_by: "https://download.docker.com/linux/ubuntu/gpg"
        state: present
      tags: [base, docker]

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [base, docker]

    - name: Configure Docker log rotation
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "local",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: restart docker
      tags: [base, docker]

    - name: Ensure docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes
      tags: [base, docker]

    - name: Create 'deploy' user for CI/CD
      user:
        name: deploy
        shell: /bin/bash
        groups: docker
        append: yes
        create_home: yes
      tags: [base]

    - name: Add deploy user's authorized key
      authorized_key:
        user: deploy
        key: "{{ deploy_user_ssh_pubkey }}"
        state: present
      when: deploy_user_ssh_pubkey is defined and deploy_user_ssh_pubkey | length > 0
      tags: [base]

    - name: Create shared Docker networks
      docker_network:
        name: "{{ item }}"
        state: present
      loop:
        - web           # Traefik <-> all apps (public routing)
        - app-backend   # app <-> app service-to-service traffic
        - monitoring    # Traefik/apps metrics <-> Prometheus
      tags: [base, apps, deploy, monitoring]

    # ============================================================
    # TRAEFIK
    # ============================================================
    - name: Create Traefik directory structure
      file:
        path: /opt/traefik/letsencrypt
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
        recurse: yes
      tags: [traefik]

    - name: Ensure acme.json exists with correct permissions
      file:
        path: /opt/traefik/letsencrypt/acme.json
        state: touch
        owner: deploy
        group: deploy
        mode: '0600'
      tags: [traefik]

    - name: Copy Traefik docker-compose template to server
      template:
        src: traefik-docker-compose.yml.j2
        dest: /opt/traefik/docker-compose.yml
        owner: deploy
        group: deploy
        mode: '0644'
      register: traefik_compose
      tags: [traefik]

    - name: Copy Traefik .env
      template:
        src: traefik.env.j2
        dest: /opt/traefik/.env
        owner: deploy
        group: deploy
        mode: '0600'
      register: traefik_env
      tags: [traefik]

    - name: Start Traefik stack
      community.docker.docker_compose_v2:
        project_src: /opt/traefik
        state: present
        pull: "{{ 'always' if (traefik_compose.changed or traefik_env.changed) else 'missing' }}"
      tags: [traefik]

    # ============================================================
    # MONITORING (Prometheus + Grafana)
    # ============================================================
    - name: Create Monitoring directory structure
      file:
        path: /opt/monitoring
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      tags: [monitoring]

    - name: Copy Prometheus config
      template:
        src: prometheus.yml.j2
        dest: /opt/monitoring/prometheus.yml
        owner: deploy
        group: deploy
        mode: '0644'
      register: prometheus_config
      tags: [monitoring]

    - name: Copy Monitoring docker-compose template to server
      template:
        src: monitoring-docker-compose.yml.j2
        dest: /opt/monitoring/docker-compose.yml
        owner: deploy
        group: deploy
        mode: '0644'
      register: monitoring_compose
      tags: [monitoring]

    - name: Copy Monitoring .env
      template:
        src: monitoring.env.j2
        dest: /opt/monitoring/.env
        owner: deploy
        group: deploy
        mode: '0600'
      register: monitoring_env
      tags: [monitoring]

    - name: Start Monitoring stack
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present
        pull: "{{ 'always' if (monitoring_compose.changed or monitoring_env.changed or prometheus_config.changed) else 'missing' }}"
      tags: [monitoring]

    # ============================================================
    # PER-APP DEPLOYMENTS (identity, api, ... — driven by vars.yml `apps`)
    # ============================================================
    - name: Log in to GHCR on the VM (for pulling private images)
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ vault_ghcr_username }}"
        password: "{{ vault_ghcr_token }}"
      tags: [apps, deploy]

    # ============================================================
    # APPS (auth + api, single compose stack)
    # ============================================================
    - name: Create apps directory
      file:
        path: /opt/apps
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      tags: [apps]

    - name: Render auth.env (base — full provision only)
      template:
        src: auth.env.j2
        dest: /opt/apps/auth.env
        owner: deploy
        group: deploy
        mode: '0600'
        force: no
      tags: [apps, secrets]

    - name: Render api.env (base — full provision only)
      template:
        src: api.env.j2
        dest: /opt/apps/api.env
        owner: deploy
        group: deploy
        mode: '0600'
        force: no
      tags: [apps, secrets]

    - name: Patch API image tag only
      lineinfile:
        path: /opt/apps/api.env
        regexp: '^API_IMAGE_TAG='
        line: "API_IMAGE_TAG={{ image_tag }}"
      when: target_app is defined and target_app == 'api'
      tags: [apps, deploy]

    - name: Patch Auth image tag only
      lineinfile:
        path: /opt/apps/auth.env
        regexp: '^AUTH_IMAGE_TAG='
        line: "AUTH_IMAGE_TAG={{ image_tag }}"
      when: target_app is defined and target_app == 'auth'
      tags: [apps, deploy]

    - name: Deploy single target service (fast path)
      community.docker.docker_compose_v2:
        project_src: /opt/apps
        state: present
        pull: always
        services:
          - "{{ target_app }}"
      when: target_app is defined
      tags: [apps, deploy]

    - name: Deploy full apps stack (full provision, no target_app)
      community.docker.docker_compose_v2:
        project_src: /opt/apps
        state: present
        pull: always
      when: target_app is not defined
      tags: [apps]

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted

    - name: restart fail2ban
      service:
        name: fail2ban
        state: restarted