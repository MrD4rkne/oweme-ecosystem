version: 2
updates:
  # NuGet Dependencies (C# Packages)
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "nuget"
    groups:
      nuget-patch:
        patterns: ["*"]
        update-types: ["patch"]
      nuget-minor:
        patterns: ["*"]
        update-types: ["minor"]

  # GitHub Actions Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "actions"
