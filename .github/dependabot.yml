version: 2
updates:
  # NuGet Dependencies (C# Packages)
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "nuget"
    groups:
      nuget-efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql.EntityFrameworkCore*"]
        update-types: ["minor", "patch"]
      nuget-aspire:
        patterns: ["Aspire.*", "CommunityToolkit.Aspire.*"]
        update-types: ["minor", "patch"]
      nuget-microsoft:
        patterns: ["Microsoft.*", "System.*"]
        update-types: ["minor", "patch"]
      nuget-other:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "actions"
    groups:
      # Actions are SHA-pinned, so every patch release is a PR; batch them.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
