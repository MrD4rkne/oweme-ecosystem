name: build-and-test

on:
  workflow_call:
    inputs:
      sln_path:
        required: true
        type: string
        description: 'Path to the solution file (e.g. api/OweMe.Api.sln)'
      project_path:
        required: true
        type: string
        description: 'Path to the project file (e.g. api/OweMe.Api/OweMe.Api.csproj)'
      working_dir:
        description: 'Directory where version.json lives (e.g. api)'
        required: true
        type: string
      test_filter:
        required: false
        type: string
      sonar_project_key:
        required: true
        type: string
        default: ''
      sonar_org:
        required: false
        type: string
        default: 'mrd4rkne'
      sonar_enforce_quality_gate:
        description: 'If true, fail the build when the Sonar quality gate fails. Set to false for nightly/trend-only runs.'
        required: false
        type: boolean
        default: true

    secrets:
      SONAR_TOKEN:
        required: true
    outputs:
      semver:
        value: ${{ jobs.build.outputs.semver }}
      image_ref:
        value: ${{ jobs.push-to-ghcr.outputs.image_ref }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.nbgv.outputs.SemVer2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            ${{ inputs.working_dir }}/**/packages.lock.json
            ${{ inputs.working_dir }}/**/*.csproj

      - name: Setup Java (required by sonar-scanner engine)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ inputs.sonar_project_key }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Calculate Version via NBGV
        uses: dotnet/nbgv@master
        id: nbgv
        with:
          path: ${{ inputs.working_dir }}

      - name: Evaluate test filter
        run: |
          echo "Test filter provided: ${{ inputs.test_filter }}"
          
          if [ -n "${{ inputs.test_filter }}" ]; then
            # Do NOT escape quotes here
            echo "FILTER_ARG=--filter \"${{ inputs.test_filter }}\"" >> $GITHUB_ENV
          else
            echo "FILTER_ARG=" >> $GITHUB_ENV
          fi

      - name: Sonar Begin
        run: >
          dotnet-sonarscanner begin
          /k:"${{ inputs.sonar_project_key }}"
          /n:"${{ inputs.sonar_project_key }}"
          /o:"${{ inputs.sonar_org }}"
          /d:sonar.scanner.skipJreProvisioning=true
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.scanner.scanAll=false
          /d:sonar.qualitygate.wait=${{ inputs.sonar_enforce_quality_gate }}
          /d:sonar.qualitygate.timeout=300
          /d:sonar.exclusions="**/Pages/**,**/Migrations/**,**/wwwroot/**"

      - name: Build
        run: dotnet build ${{ inputs.working_dir }} --configuration Release

      - name: Test
        run: >
          dotnet test ${{ inputs.working_dir }}
          --configuration Release
          --no-build
          --logger trx
          --collect:"XPlat Code Coverage" ${{ env.FILTER_ARG }}
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Sonar End
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Logs (.trx)
        uses: actions/upload-artifact@v7
        if: always() # Ensures logs are uploaded even if tests fail
        with:
          name: test-results-${{ inputs.sonar_project_key }}
          path: '**/*.trx'
          retention-days: 14

      - name: Publish Test Results to Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false
