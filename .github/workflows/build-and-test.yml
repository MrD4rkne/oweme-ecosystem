name: build-and-test

on:
  workflow_call:
    inputs:
      sln_path:
        required: true
        type: string
        description: 'Path to the solution file (e.g. api/OweMe.Api.slnx)'
      project_path:
        required: true
        type: string
        description: 'Path to the project file (e.g. api/OweMe.Api/OweMe.Api.csproj)'
      working_dir:
        description: 'Directory where version.json lives (e.g. api)'
        required: true
        type: string
      test_filter:
        required: false
        type: string
      sonar_project_key:
        required: true
        type: string
        default: ''
      sonar_org:
        required: false
        type: string
        default: 'mrd4rkne'
      sonar_enforce_quality_gate:
        description: 'If true, fail the build when the Sonar quality gate fails. Set to false for nightly/trend-only runs.'
        required: false
        type: boolean
        default: true

    secrets:
      SONAR_TOKEN:
        required: true
    outputs:
      semver:
        value: ${{ jobs.build.outputs.semver }}
      image_ref:
        value: ${{ jobs.push-to-ghcr.outputs.image_ref }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.nbgv.outputs.SemVer2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: |
            ${{ inputs.working_dir }}/**/packages.lock.json
            ${{ inputs.working_dir }}/**/*.csproj

      - name: Setup Java (required by sonar-scanner engine)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ inputs.sonar_project_key }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Calculate Version via NBGV
        uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
        id: nbgv
        with:
          path: ${{ inputs.working_dir }}

      - name: Sonar Begin
        run: >
          dotnet-sonarscanner begin
          /k:"${{ inputs.sonar_project_key }}"
          /n:"${{ inputs.sonar_project_key }}"
          /o:"${{ inputs.sonar_org }}"
          /d:sonar.scanner.skipJreProvisioning=true
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.sources="api/api/src"
          /d:sonar.tests="api/api/tests"
          /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/*.cobertura.xml"
          /d:sonar.scanner.scanAll=false
          /d:sonar.qualitygate.wait=${{ inputs.sonar_enforce_quality_gate }}
          /d:sonar.qualitygate.timeout=300
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/aspire/**"

      - name: Build
        env:
          WORKING_DIR: ${{ inputs.working_dir }}
        run: dotnet build "$WORKING_DIR" --configuration Release

      # The build regenerates the NSwag client; a diff means an API change was committed without it.
      # -I ignores the generator version (header + GeneratedCode attributes) so NSwag bumps alone don't fail here.
      # The GeneratedCode pattern is anchored so anything else on that line is still caught.
      # git diff skips untracked files, so a newly generated file is checked separately.
      - name: Verify generated API client is committed
        env:
          CLIENT_PATHSPEC: ${{ inputs.working_dir }}/client/*.cs
        run: |
          rc=0
          git diff --exit-code -I '^//     Generated using the NSwag toolchain v|^ *\[System\.CodeDom\.Compiler\.GeneratedCode\("(NSwag|NJsonSchema)", "[^"]*"\)\]$' -- "$CLIENT_PATHSPEC" || rc=1
          untracked=$(git ls-files --others --exclude-standard -- "$CLIENT_PATHSPEC")
          if [ -n "$untracked" ]; then echo "::error::Untracked generated files:"; echo "$untracked"; rc=1; fi
          exit $rc

      - name: Test
        env:
          WORKING_DIR: ${{ inputs.working_dir }}
          TEST_FILTER: ${{ inputs.test_filter }}
        # ${VAR:+...} adds --filter only when a filter is set; the quotes keep it one argument.
        run: >
          dotnet test "$WORKING_DIR"
          --configuration Release
          --no-build
          ${TEST_FILTER:+--filter "$TEST_FILTER"}
          --
          --coverage
          --coverage-output-format cobertura
          --report-trx
          --ignore-exit-code 8

      - name: Sonar End
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Logs and Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # Ensures logs are uploaded even if tests fail
        with:
          name: test-results-${{ inputs.sonar_project_key }}
          path: |
            **/*.trx
            **/*.cobertura.xml
          retention-days: 14

      - name: Publish Test Results to Summary
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false
