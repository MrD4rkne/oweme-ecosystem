name: Configure Environments

on:
  workflow_dispatch:
    inputs:
      force_env_render:
        required: false
        type: boolean
        default: false
        description: 'Force re-render of api.env even if it already exists on the host'

  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-all.yml"
      - ".github/workflows/reusable-configure-vm.yml"
      - "infra/step_02_configure_vm/**"
  workflow_call:

permissions:
  contents: read
  deployments: write

jobs:
  configure-staging:
    uses: ./.github/workflows/reusable-configure-vm.yml
    with:
      environment_name: 'staging'
      force_env_render: ${{ inputs.force_env_render || false }}
    secrets: inherit

  # Full provision of production is never automatic: infra changes are rarer and riskier than app deploys.
  configure-production:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-configure-vm.yml
    with:
      environment_name: 'production'
      force_env_render: ${{ inputs.force_env_render || false }}
    secrets: inherit
    needs: configure-staging
