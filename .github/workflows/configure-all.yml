name: Configure Environments

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-all.yml"
      - ".github/workflows/reusable-configure-vm.yml"
      - "infra/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  provision:
    uses: ./.github/workflows/reusable-configure-vm.yml
    with:
      environment_name: 'staging'
    secrets: inherit

  provision-prod:
    uses: ./.github/workflows/reusable-configure-vm.yml
    with:
      environment_name: 'production'
    secrets: inherit
