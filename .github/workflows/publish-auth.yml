name: Publish Auth

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  publish-auth:
    name: Publish Auth
    uses: ./.github/workflows/push-to-ghcr.yml
    with:
      image_name: 'oweme-auth'
      dockerfile_path: 'src/auth/src/OweMe.Identity.Server/Dockerfile'
      context: '.'
      working_dir: 'src/auth'
