name: Provision Infrastructure (choose environment)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to provision'
        required: true
        type: choice
        options:
          - staging
          - production
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/provision-infra-dispatch.yml"

jobs:
  provision:
    uses: ./.github/workflows/provision-infra.yml
    with:
      environment_name: ${{ inputs.environment }}
    secrets: inherit
