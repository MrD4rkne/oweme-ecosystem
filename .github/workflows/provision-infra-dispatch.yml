name: Provision Infrastructure (choose environment)

on:
  workflow_dispatch:
    # inputs:
    #   environment:
    #     description: 'Environment to provision'
    #     required: true
    #     type: choice
    #     options:
    #       - staging
    #       - production
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/provision-infra-dispatch.yml"

permissions:
  contents: read
  deployments: write

jobs:
  provision:
    uses: ./.github/workflows/provision-infra.yml
    with:
      environment_name: 'staging'
    secrets: inherit

  provision-prod:
    uses: ./.github/workflows/provision-infra.yml
    with:
      environment_name: 'production'
    secrets: inherit
