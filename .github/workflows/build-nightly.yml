name: Build nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/build-nightly.yml" ]
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/build-nightly.yml" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify-api:
    name: Verify API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-api.yml
    secrets: inherit
    with:
      sonar_enforce_quality_gate: false

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    env:
      IdentityProviderSettings__Address: http://localhost:8080/realms/oweme-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Dockerfile bind-mounts .git for nbgv

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Start stack
        run: docker compose up --build --wait --wait-timeout 600

      - name: Run smoke tests
        run: dotnet test --project api/api/tests/OweMe.Api.SmokeTests/OweMe.Api.SmokeTests.csproj --configuration Release

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color
