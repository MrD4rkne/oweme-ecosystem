name: Build nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/build-nightly.yml" ]
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/build-nightly.yml" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify-api:
    name: Verify API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-api.yml
    secrets: inherit
    with:
      sonar_enforce_quality_gate: false

  smoke-tests:
    name: Smoke tests (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [compose, aspire]
    env:
      IdentityProviderSettings__Address: http://localhost:8080/realms/oweme-dev
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Dockerfile bind-mounts .git for nbgv

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Start stack (compose)
        if: matrix.stack == 'compose'
        run: docker compose up --build --wait --wait-timeout 600

      - name: Start stack (aspire)
        if: matrix.stack == 'aspire'
        run: |
          nohup dotnet run --project api/aspire/OweMe.AppHost > apphost.log 2>&1 &
          curl -fs --retry 120 --retry-delay 5 --retry-all-errors http://localhost:5000/healthz

      - name: Run smoke tests
        run: dotnet test --project api/api/tests/OweMe.Api.SmokeTests/OweMe.Api.SmokeTests.csproj --configuration Release

      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color 2>/dev/null; cat apphost.log 2>/dev/null; true
