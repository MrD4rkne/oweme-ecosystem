name: Deploy
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to deploy to (e.g. staging, production)'
      app_name:
        required: true
        type: string
        description: 'Compose service to redeploy, e.g. api (passed to Ansible as target_app)'
      image_tag:
        required: true
        type: string
        description: 'Exact image tag to deploy (from a prior build job output)'
      smoke_tests:
        required: false
        type: boolean
        default: false
        description: 'Run OweMe.Api.SmokeTests against the environment after deploying'
    outputs:
      deployed:
        description: "'true' when this run's image is the one now running (not skipped as older)"
        value: ${{ jobs.deploy.outputs.deployed }}
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.verify.outputs.deployed }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.API_URL }}
    # Default queue: one running + newest pending; an older pending deploy is cancelled, so deploys never stack.
    # Smoke tests run inside this job, so they hold the same slot and test the version this job deployed.
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_APP: ${{ inputs.app_name }}
      TARGET_ENV: ${{ inputs.environment_name }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # NBGV fails on a shallow clone when building the smoke tests

      - uses: ./.github/actions/setup-ansible
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Deploy ${{ inputs.app_name }} only
        working-directory: infra/step_02_configure_vm
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i "inventory/${TARGET_ENV}/hosts.ini" site.yml \
            --tags deploy \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "image_tag=${IMAGE_TAG}" \
            -e "target_app=${TARGET_APP}" \
            -e "target_environment=${TARGET_ENV}"

      # The Ansible version guard skips an image older than the one running and exits green; tell the two apart here.
      - name: Verify running version
        id: verify
        if: inputs.app_name == 'api'
        run: |
          for _ in $(seq 12); do
            running=$(curl -fsS "${API_URL}/api/info" | jq -r '.buildVersion // empty' | cut -d+ -f1) || running=""
            if [[ "$running" == "$IMAGE_TAG" ]]; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              echo "Deployed \`${TARGET_APP}\` **${IMAGE_TAG}** to **${TARGET_ENV}**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -n "$running" ]] && [[ "$(printf '%s\n%s\n' "$IMAGE_TAG" "$running" | sort -V | tail -n1)" == "$running" ]]; then
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipped: ${running} is already running on ${TARGET_ENV} (newer than ${IMAGE_TAG})"
              echo "Skipped \`${TARGET_APP}\` ${IMAGE_TAG} on **${TARGET_ENV}**: newer ${running} already running" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected ${IMAGE_TAG} on ${TARGET_ENV}, got '${running}'"
          exit 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.smoke_tests && steps.verify.outputs.deployed == 'true'
        with:
          dotnet-version: 10.x

      - name: Smoke tests
        if: inputs.smoke_tests && steps.verify.outputs.deployed == 'true'
        env:
          ApiSettings__BaseUrl: ${{ vars.API_URL }}
          IdentityProviderSettings__Address: ${{ vars.IDP_REALM_URL }}
          UserSettings__UserName: ${{ secrets.SMOKE_USER }}
          UserSettings__Password: ${{ secrets.SMOKE_PASSWORD }}
        run: dotnet test --project api/api/tests/OweMe.Api.SmokeTests/OweMe.Api.SmokeTests.csproj --configuration Release
