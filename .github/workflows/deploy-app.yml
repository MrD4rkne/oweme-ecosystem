name: Deploy
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to deploy to (e.g. staging, production)'
      app_name:
        required: true
        type: string
        description: 'Compose service to redeploy, e.g. api (passed to Ansible as target_app)'
      image_tag:
        required: true
        type: string
        description: 'Exact image tag to deploy (from a prior build job output)'
      smoke_tests:
        required: false
        type: boolean
        default: false
        description: 'Run OweMe.Api.SmokeTests against the environment after deploying'
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
      queue: max # keep every pending provision/deploy instead of replacing it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # NBGV fails on a shallow clone when building the smoke tests

      - uses: ./.github/actions/setup-ansible
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Deploy ${{ inputs.app_name }} only
        working-directory: infra/step_02_configure_vm
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/${{ inputs.environment_name }}/hosts.ini site.yml \
            --tags deploy \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "image_tag=${{ inputs.image_tag }}" \
            -e "target_app=${{ inputs.app_name }}" \
            -e "target_environment=${{ inputs.environment_name }}"

      # Same job as the deploy, so it holds the same concurrency slot and tests the version just deployed.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.smoke_tests
        with:
          dotnet-version: 10.x

      - name: Smoke tests
        if: inputs.smoke_tests
        env:
          ApiSettings__BaseUrl: ${{ vars.API_URL }}
          IdentityProviderSettings__Address: ${{ vars.IDP_REALM_URL }}
          UserSettings__UserName: ${{ secrets.SMOKE_USER }}
          UserSettings__Password: ${{ secrets.SMOKE_PASSWORD }}
        run: dotnet test --project api/api/tests/OweMe.Api.SmokeTests/OweMe.Api.SmokeTests.csproj --configuration Release
