name: Deploy
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to deploy to (e.g. staging, production)'
      app_name:
        required: true
        type: string
        description: 'Must match a name in ansible/vars.yml apps: list'
      image_tag:
        required: true
        type: string
        description: 'Exact image tag to deploy (from a prior build job output)'
permissions:
  contents: read
  deployments: write
  packages: write
jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ansible
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Deploy ${{ inputs.app_name }} only
        working-directory: infra/step_02_provission_vm
        run: |
          ansible-playbook -i inventory/${{ inputs.environment_name }}/hosts.ini site.yml \
            --tags deploy \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "image_tag=${{ inputs.image_tag }}" \
            -e "target_app=${{ inputs.app_name }}" \
            -e "target_environment=${{ inputs.environment_name }}"
