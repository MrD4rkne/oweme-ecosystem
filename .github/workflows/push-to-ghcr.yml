name: Push to GHCR

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: 'Name of the Docker image to build and push (e.g. oweme-api)'
      dockerfile_path:
        required: true
        type: string
      context:
        required: false
        type: string
        default: '.'
      working_dir:
        description: 'Directory where version.json lives (e.g. api)'
        required: true
        type: string
      push_latest:
        description: 'Whether this ref is allowed to move the "latest" tag'
        required: false
        type: boolean
        default: false
    outputs:
      image_ref:
        description: 'Fully qualified image reference with SemVer2 tag'
        value: ${{ jobs.push-to-ghcr.outputs.image_ref }}

permissions:
  contents: read
  packages: write

jobs:
  push-to-ghcr:
    name: Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.set_image_ref.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Version via NBGV
        uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
        id: nbgv
        with:
          path: ${{ inputs.working_dir }}

      - name: Compute tags
        id: set_image_ref
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"
          base="ghcr.io/${repo_lower}/${{ inputs.image_name }}"
          semver_tag="${base}:${{ steps.nbgv.outputs.SemVer2 }}"

          # sanitize branch name for use as a tag (slashes, etc. aren't valid in tags)
          branch_tag_name=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-')
          branch_tag="${base}:${branch_tag_name}"

          tags="${semver_tag},${branch_tag}"

          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            tags="${tags},${base}:latest"
          fi

          echo "image_ref=${{ steps.nbgv.outputs.SemVer2 }}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.set_image_ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
