name: Push to GHCR

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: 'Name of the Docker image to build and push (e.g. oweme-api)'
      dockerfile_path:
        required: true
        type: string
      context:
        required: false
        type: string
        default: '.'
      working_dir:
        description: 'Directory where version.json lives (e.g. api)'
        required: true
        type: string
      push_latest:
        description: 'Whether this ref is allowed to move the "latest" tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  push-to-ghcr:
    name: Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.set_image_ref.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version via NBGV
        uses: dotnet/nbgv@master
        id: nbgv
        with:
          path: ${{ inputs.working_dir }}

      - name: Compute tags
        id: set_image_ref
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"
          base="ghcr.io/${repo_lower}/${{ inputs.image_name }}"
          semver_tag="${base}:${{ steps.nbgv.outputs.SemVer2 }}"

          # sanitize branch name for use as a tag (slashes, etc. aren't valid in tags)
          branch_tag_name=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-')
          branch_tag="${base}:${branch_tag_name}"

          tags="${semver_tag},${branch_tag}"

          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            tags="${tags},${base}:latest"
          fi

          echo "image_ref=${semver_tag}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.set_image_ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
