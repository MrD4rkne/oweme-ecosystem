name: Configure Environment

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to provision (e.g. staging, production)'
      force_env_render:
        required: false
        type: boolean
        default: false
        description: 'Force re-render of api.env even if it already exists on the host'

permissions:
  contents: read
  deployments: write

jobs:
  provision-vm:
    name: Run Ansible (full provision) — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
      queue: max # keep every pending provision/deploy instead of replacing it
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ansible
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run full provision
        working-directory: infra/step_02_configure_vm
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/${{ inputs.environment_name }}/hosts.ini site.yml \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "target_environment=${{ inputs.environment_name }}" \
            -e "force_env_render=${{ inputs.force_env_render }}"
