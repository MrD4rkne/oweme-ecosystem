name: Provision Infrastructure

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to provision (e.g. staging, production)'

permissions:
  contents: read
  deployments: write

jobs:
  provision-vm:
    name: Run Ansible (full provision) — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Install collections
        run: ansible-galaxy collection install community.docker

      - name: Validate VM IP secret
        env:
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          if [ -z "$VM_IP" ]; then
            echo "VM_IP secret is not set for environment '${{ inputs.environment_name }}'." >&2
            exit 1
          fi

      - name: Run full provision
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          VAULT_PW: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd infra/step_02_provission_vm
          echo "$SSH_KEY" > deploy_key && chmod 600 deploy_key
          echo "$VAULT_PW" > .vault_pass && chmod 600 .vault_pass
          ansible-playbook \
            -i inventory/${{ inputs.environment_name }}/hosts.ini \
            site.yml \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "target_environment=${{ inputs.environment_name }}"