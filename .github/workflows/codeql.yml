name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 21 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}${{ matrix.project-dir && format(' - {0}', matrix.project-dir) || '' }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: csharp
            build-mode: manual
            project-dir: ./api
            category: "/language:csharp:./src/api"

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history for Nbgv versioning and CodeQL analysis

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.x

    - name: Install Aspire CLI
      if: matrix.language == 'csharp'
      run: dotnet tool install -g Aspire.Cli

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up Nbgv
      uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
      if: matrix.build-mode == 'manual' && matrix.language == 'csharp'
      id: nbgv

    - name: Build C# Project
      if: matrix.build-mode == 'manual' && matrix.language == 'csharp'
      working-directory: ${{ matrix.project-dir }}
      run: dotnet build ${{ matrix.target }} --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        category: ${{ matrix.category || format('/language:{0}{1}', matrix.language, matrix.project-dir && format(':{0}', matrix.project-dir) || '') }}
