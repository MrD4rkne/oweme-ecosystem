name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 21 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}${{ matrix.project-dir && format(' - {0}', matrix.project-dir) || '' }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: csharp
            build-mode: manual
            project-dir: ./auth
            category: "/language:csharp:./src/auth"

          - language: csharp
            build-mode: manual
            project-dir: ./api
            category: "/language:csharp:./src/api"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for Nbgv versioning and CodeQL analysis

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ vars.DOTNET_VERSION }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up Nbgv
      uses: dotnet/nbgv@master
      if: matrix.build-mode == 'manual' && matrix.language == 'csharp'
      id: nbgv

    - name: Build C# Project
      if: matrix.build-mode == 'manual' && matrix.language == 'csharp'
      working-directory: ${{ matrix.project-dir }}
      run: dotnet build ${{ matrix.target }} --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: ${{ matrix.category || format('/language:{0}{1}', matrix.language, matrix.project-dir && format(':{0}', matrix.project-dir) || '') }}
