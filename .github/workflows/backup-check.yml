name: Backup check

# Fails when a bucket has no api+keycloak dump pair from the last 26 hours (issue #101). GitHub notifies whoever last
# edited the cron line; keep Settings -> Notifications -> Actions -> "failed workflows" on, with email, for that account.
# Catches a broken cron, a dead VM, an expired PAR or a full bucket alike.
# Secrets: BACKUP_CHECK_PAR_URL_<ENV> = Pulumi output BackupCheckParUrl (read-only PAR, safe outside the gated environments).

on:
  schedule:
    - cron: '17 5 * * *' # after the 03:00 UTC dump; off the hour, when GitHub drops scheduled runs
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Backup check — ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: staging
            secret: BACKUP_CHECK_PAR_URL_STAGING
          - env: production
            secret: BACKUP_CHECK_PAR_URL_PRODUCTION
    steps:
      - name: Look for a fresh dump pair
        env:
          # Static references: secrets[matrix.secret] would hand every repo secret to the runner (CodeQL).
          # Not `a && b || c` either: an empty staging secret would fall through to the production URL.
          BACKUP_CHECK_PAR_URL_STAGING: ${{ secrets.BACKUP_CHECK_PAR_URL_STAGING }}
          BACKUP_CHECK_PAR_URL_PRODUCTION: ${{ secrets.BACKUP_CHECK_PAR_URL_PRODUCTION }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          set -euo pipefail
          PAR_URL=${!SECRET_NAME}
          if [[ -z "$PAR_URL" ]]; then
            echo "::error::Secret $SECRET_NAME is not set"
            exit 1
          fi

          # Objects are <run>/{api,keycloak}.dump with run = UTC yyyymmddThhmmssZ, so names sort by time.
          # start= lists only names from the cutoff on, so the 1000-object page limit can't hide fresh runs.
          cutoff=$(date -u -d '26 hours ago' +%Y%m%dT%H%M%SZ)
          latest=$(curl -fsS --proto '=https' --retry 3 --max-time 60 -K - <<< "url = \"${PAR_URL}?start=${cutoff}\"" \
            | jq -r '.objects[].name' \
            | grep -E '^[0-9]{8}T[0-9]{6}Z/(api|keycloak)\.dump$' \
            | cut -d/ -f1 | sort | uniq -c | awk '$1 == 2 { print $2 }' | tail -n1 || true)

          if [[ -z "$latest" || "$latest" < "$cutoff" ]]; then
            echo "::error::No complete backup since $cutoff (latest complete run: ${latest:-none})"
            exit 1
          fi
          echo "Latest complete backup: $latest"
