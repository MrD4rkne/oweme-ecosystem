name: Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
        description: 'GitHub Environment to deploy to (e.g. staging, production)'
      app_name:
        required: true
        type: string
        description: 'Must match a name in ansible/vars.yml apps: list'
      image_tag:
        required: true
        type: string
        description: 'Exact image tag to deploy (from a prior build job output)'

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} — ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Install collections
        run: ansible-galaxy collection install community.docker

      - name: Validate VM IP secret
        env:
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          if [ -z "$VM_IP" ]; then
            echo "VM_IP secret is not set for environment '${{ inputs.environment_name }}'." >&2
            exit 1
          fi

      - name: Write inventory
        env:
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          mkdir -p infra/step_02_vm/inventory
          cat > infra/step_02_vm/inventory/hosts.ini <<EOF
          [vm]
          oweme-vm ansible_host=$VM_IP ansible_user=ubuntu

          [vm:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Deploy ${{ inputs.app_name }} only
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          VAULT_PW: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd infra/step_02_vm
          echo "$SSH_KEY" > deploy_key && chmod 600 deploy_key
          echo "$VAULT_PW" > .vault_pass && chmod 600 .vault_pass
          ansible-playbook -i inventory/hosts.ini site.yml \
            --tags deploy \
            --private-key deploy_key \
            --vault-password-file .vault_pass \
            -e "image_tag=${{ inputs.image_tag }}" \
            -e "target_app=${{ inputs.app_name }}" \
            -e "target_environment=${{ inputs.environment_name }}"
