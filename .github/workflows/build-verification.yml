name: PR Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify-api:
    name: Verify API
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  verify-auth:
    name: Verify Authentication
    uses: ./.github/workflows/build-auth.yml
    secrets: inherit
