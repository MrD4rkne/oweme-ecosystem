name: PR Verification

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify-api:
    name: Verify API
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  verify-api-image:
    name: Verify API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nbgv needs history; Dockerfile bind-mounts .git

      # Job-level filter (not workflow-level paths:) so the required check still reports on unrelated PRs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            api:
              - 'api/**'
              - 'version.json'
              - '.dockerignore'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.api == 'true'

      - name: Build image (no push)
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/api/src/OweMe.Api/Dockerfile
          push: false
          cache-from: type=gha
