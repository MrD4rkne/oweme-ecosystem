name: Build API

on:
  workflow_call:
    secrets:
      SONAR_API_TOKEN:
        required: true
    outputs:
      semver:
        value: ${{ jobs.build-and-test-api.outputs.semver }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test-api:
    name: Build & Test API
    uses: ./.github/workflows/build-and-test.yml
    with:
      sln_path: 'api/OweMe.Api.sln'
      project_path: 'api/OweMe.Api/OweMe.Api.csproj'
      working_dir: 'api'
      test_filter: 'FullyQualifiedName!~SmokeTests'
      sonar_project_key: ${{ vars.SONAR_API_PROJECT_KEY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
