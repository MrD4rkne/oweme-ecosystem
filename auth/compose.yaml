services:
  keycloak:
    image: keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      keycloak_db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9000:9000"
    networks:
      - oweme-network
      - default
    volumes:
      - ./realms:/opt/keycloak/data/import
    env_file:
      - path: .env
        required: true

  keycloak_db:
    image: bitnami/postgresql:latest
    env_file:
      - path: .env
        required: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRESQL_USERNAME -d $$POSTGRESQL_DATABASE"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  oweme-network:
    driver: bridge
    name: oweme-network
