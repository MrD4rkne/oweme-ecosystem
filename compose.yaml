name: oweme-system

include:
  - path: ./auth/compose.yaml
  - path: ./api/compose.yaml

services:
  oweme.jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: oweme.jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  oweme.identity:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://oweme.seq:5341/ingest/otlp      # logs + metrics fall back here
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://oweme.jaeger:4318/v1/traces  # traces override, used as-is
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: oweme.identity
    depends_on:
      oweme.seq:
        condition: service_started
      oweme.jaeger:
        condition: service_started

  oweme.api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://oweme.seq:5341/ingest/otlp      # logs + metrics fall back here
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://oweme.jaeger:4318/v1/traces  # traces override, used as-is
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: oweme.api
    depends_on:
      oweme.identity:
        condition: service_healthy
      oweme.seq:
        condition: service_started
      oweme.jaeger:
        condition: service_started
  
  oweme.seq:
    image: datalust/seq:latest
    container_name: oweme.seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"   # ingestion (HTTP/OTLP)
      - "8081:80"     # web UI
    volumes:
      - seq-data:/data

volumes:
  seq-data: