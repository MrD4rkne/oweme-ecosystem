
include:
  - ./owe-me-api/compose.yaml
  - ./owe-me-identityserver/compose.yaml

services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=YourStrongAdminPasswordHere
    volumes:
      - seq-data:/data

volumes:
  seq-data: